---
apiVersion: v1
kind: Pod
metadata:
  name: tomcat-pod
  labels:
    app: appserver
spec:
  containers:
    - name: mytomcat
      image: tomee
      ports:
        - containerPort: 8080
          hostPort: 9090
      resources:
        requests:
          cpu: 200m
          memory: 64M
        limits:
          cpu: 500m
          memory: 128M
...
